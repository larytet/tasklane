{{- if and (eq .Values.blobs.backend "fs") .Values.blobs.persistence.enabled (not .Values.blobs.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tasklane.fullname" . }}
  labels:
    {{- include "tasklane.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # attachments outlive an uninstall
spec:
  accessModes: [{{ .Values.blobs.persistence.accessMode }}]
  {{- with .Values.blobs.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.blobs.persistence.size }}
{{- end }}
