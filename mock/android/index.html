<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasklane for Android: interactive mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Material 3 baseline colour schemes: what darkColorScheme() / lightColorScheme() give in the app */
:root{
  --primary:#6750A4; --on-primary:#fff; --primary-c:#EADDFF; --on-primary-c:#21005D;
  --secondary:#625B71; --secondary-c:#E8DEF8; --on-secondary-c:#1D192B; --tertiary:#7D5260;
  --surface:#FEF7FF; --on-surface:#1D1B20; --surface-var:#E7E0EC; --on-surface-var:#49454F;
  --outline:#79747E; --outline-var:#CAC4D0; --error:#B3261E;
  --sc-low:#F7F2FA; --sc:#F3EDF7; --sc-high:#ECE6F0;
  --stage:#e9e9f0;
}
body.dark{
  --primary:#D0BCFF; --on-primary:#381E72; --primary-c:#4F378B; --on-primary-c:#EADDFF;
  --secondary:#CCC2DC; --secondary-c:#4A4458; --on-secondary-c:#E8DEF8; --tertiary:#EFB8C8;
  --surface:#141218; --on-surface:#E6E0E9; --surface-var:#49454F; --on-surface-var:#CAC4D0;
  --outline:#938F99; --outline-var:#49454F; --error:#F2B8B5;
  --sc-low:#1D1B20; --sc:#211F26; --sc-high:#2B2930;
  --stage:#0b0b0e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Roboto,system-ui,"Segoe UI",sans-serif;background:var(--stage);color:var(--on-surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 16px;min-height:100%;
  -webkit-font-smoothing:antialiased}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--on-surface-var);align-items:center}
.bar button,.bar select{font:inherit;border:1px solid var(--outline-var);background:var(--sc);color:var(--on-surface);border-radius:16px;padding:5px 12px;cursor:pointer}
.bar a{color:var(--primary)}
.note{margin:0;font-size:12px;color:var(--on-surface-var);text-align:center;max-width:420px}

body.bare{padding:0;gap:0;justify-content:flex-start;align-items:flex-start;display:block}
body.bare .bar,body.bare .note{display:none}
.stage{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:44px;border:10px solid #000;background:var(--surface);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);color:var(--on-surface)}

/* Material 3 type scale */
.t-hl{font-size:32px;line-height:40px;font-weight:400}
.t-tl{font-size:22px;line-height:28px;font-weight:400}
.t-ts{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.t-bl{font-size:16px;line-height:24px;font-weight:400;letter-spacing:.5px}
.t-bm{font-size:14px;line-height:20px;font-weight:400;letter-spacing:.25px}
.t-bs{font-size:12px;line-height:16px;font-weight:400;letter-spacing:.4px}
.t-ll{font-size:14px;line-height:20px;font-weight:500;letter-spacing:.1px}
.t-lm{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.t-lsm{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-var)}
.key{color:var(--primary)}

.sb{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:16px;font-weight:500}
.sb svg{width:20px;height:20px;fill:currentColor;margin-left:4px;vertical-align:middle}
.tb{flex:none;height:64px;display:flex;align-items:center;padding:0 4px 0 16px}
.tb.back{padding-left:4px}
.tb .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb.back .title{padding-left:12px}
.ib{width:48px;height:48px;border:0;background:none;color:var(--on-surface-var);border-radius:50%;cursor:pointer;display:grid;place-items:center;padding:0;flex:none}
.tb .ib{color:var(--on-surface)}
.ib:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
svg.i{width:24px;height:24px;fill:currentColor}
.content{flex:1;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content.fixed{display:flex;flex-direction:column;overflow:hidden}

/* bottom: navigation bar (80dp) + gesture inset */
.nav{flex:none;background:var(--sc);display:flex;padding-bottom:var(--gi)}
.nav .item{flex:1;height:80px;border:0;background:none;color:var(--on-surface-var);font:inherit;display:flex;flex-direction:column;align-items:center;padding-top:12px;cursor:pointer}
.nav .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;margin-bottom:4px;color:var(--on-surface-var)}
.nav .on{color:var(--on-surface)}
.nav .on .pill{background:var(--secondary-c);color:var(--on-secondary-c)}
.gi{flex:none;height:var(--gi);position:relative}
.gi:after{content:"";position:absolute;left:50%;bottom:8px;width:108px;height:4px;margin-left:-54px;border-radius:2px;background:var(--on-surface)}
.nav{position:relative}
.nav:after{content:"";position:absolute;left:50%;bottom:8px;width:108px;height:4px;margin-left:-54px;border-radius:2px;background:var(--on-surface)}

/* fields */
.field{position:relative;height:56px}
.field .box{position:absolute;inset:0;border:1px solid var(--outline);border-radius:4px;display:flex;align-items:center;padding:0 16px;gap:12px}
.field:focus-within .box{border:2px solid var(--primary);padding:0 15px}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--on-surface);font:inherit;font-size:16px;letter-spacing:.5px;padding:0;height:100%}
.field input::placeholder{color:var(--on-surface-var)}
.field .lead{color:var(--on-surface-var);margin-left:-4px}
.field label{position:absolute;left:12px;top:-8px;background:var(--surface);padding:0 4px;font-size:12px;line-height:16px;color:var(--on-surface-var)}
.field:focus-within label{color:var(--primary)}
.searchrow{flex:none;display:flex;align-items:center;padding:8px 4px 8px 12px}
.searchrow .field{flex:1}
.ib.on{color:var(--primary)}

/* chips: status category / priority, as in Common.kt (fixed colours, 15% fill) */
.chip{display:inline-block;border-radius:8px;padding:2px 8px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px;white-space:nowrap}
.c-todo{--c:#616161}.c-in_progress{--c:#1565C0}.c-done{--c:#2E7D32}
.p-low{--c:#616161}.p-medium{--c:#EF6C00}.p-high,.p-highest{--c:#C62828}
.chip{color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.chip.sec{--c:var(--secondary)}
hr,.div{border:0;height:1px;background:var(--outline-var);margin:0}

/* issue rows */
.irow{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--outline-var)}
.irow:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.irow .l1{display:flex;gap:8px;align-items:center}
.irow .sum{margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* lens */
.lens{user-select:none;-webkit-user-select:none;flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
.lr{overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 16px;cursor:pointer;background:var(--surface);transition:height .07s linear}
.lr.inlens{background:color-mix(in srgb,var(--primary-c) 35%,var(--surface))}
.lr .l1{display:flex;gap:8px;align-items:center}
.lr .sum{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .sum.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lv2,.lv1{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px}
.lv2 .l1,.lv1 .l1{flex:none}
.lv2 .sum,.lv1 .sum{margin:0;font-size:14px;line-height:20px;letter-spacing:.25px;white-space:nowrap}
.lv2 .meta,.lv2 .chip.pc,.lv1 .meta,.lv1 .chip{display:none}
.lv1 .key{letter-spacing:0;font-weight:400}
.lv1 .sum{line-height:1.1;letter-spacing:0}
.lv0{padding:0;border-bottom:1px solid var(--surface);background:color-mix(in srgb,var(--c) 55%,transparent)}
.lv0 *{display:none}
.lcount{flex:none;text-align:center;padding:6px;color:var(--on-surface-var)}

/* issue screen */
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:4px}
.kv{display:flex}.kv>span:first-child{width:96px;flex:none;color:var(--on-surface-var)}
.fields{display:flex;flex-direction:column;gap:4px}
.cmt{border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--surface-var) 40%,transparent)}
.cmt .h{display:flex;gap:8px;align-items:center}
.cbar{flex:none;background:color-mix(in srgb,var(--primary) 8.2%,var(--surface));padding:8px;display:flex;align-items:flex-end;gap:0}
.cbar .field{flex:1}
.cbar .ib{color:color-mix(in srgb,var(--on-surface) 38%,transparent)}
.cbar .ib.go{color:var(--on-surface-var)}
/* list items (projects, inbox) */
.li{display:flex;align-items:center;gap:16px;padding:8px 16px;min-height:72px;cursor:pointer}
.li:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.li.three{align-items:center;padding:12px 16px}
.li .grow{flex:1;min-width:0}
.badge{width:6px;height:6px;border-radius:3px;background:var(--error);align-self:flex-start;margin-top:4px}
.tbtn{border:0;background:none;color:var(--primary);font:inherit;font-weight:500;font-size:14px;letter-spacing:.1px;height:40px;margin:4px 0;padding:0 12px;border-radius:20px;cursor:pointer}
.tbtn:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.assist{display:inline-flex;align-items:center;height:32px;padding:0 13px;border:1px solid var(--outline);border-radius:8px;color:var(--on-surface);margin-right:8px;cursor:pointer}
/* board */
.tabs{display:flex;padding:0 8px;position:relative;border-bottom:1px solid var(--outline-var);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--on-surface-var);font:inherit;font-size:14px;font-weight:500;letter-spacing:.1px;height:48px;min-width:90px;padding:0 16px;cursor:pointer;position:relative;white-space:nowrap}
.tabs .on{color:var(--primary)}
.tabs .on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary)}
.cards{padding:12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--sc-low);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.2),0 1px 3px 1px rgba(0,0,0,.1)}
.card .l1{display:flex;gap:8px}
/* login */
.login{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:stretch;text-align:center}
.login .t-hl{margin-bottom:24px}
.login .field{margin-top:8px}.login .field:first-of-type{margin-top:0}
.btn{margin-top:16px;height:40px;border:0;border-radius:20px;background:var(--primary);color:var(--on-primary);font:inherit;font-weight:500;font-size:14px;letter-spacing:.1px;cursor:pointer}
.err{color:var(--error);margin-top:8px;text-align:left}
.menu{position:absolute;right:8px;top:calc(var(--sbh) + 56px);background:var(--sc);border-radius:4px;padding:8px 0;min-width:112px;box-shadow:0 2px 6px 2px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.3);z-index:5}
.menu div{height:48px;display:flex;align-items:center;padding:0 12px;white-space:nowrap}
.menu .dis{color:color-mix(in srgb,var(--on-surface) 38%,transparent)}.menu .act{cursor:pointer}
.menu .act:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--on-surface);color:var(--surface);padding:9px 16px;border-radius:4px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="bar">
  <button id="theme">Dark mode</button>
  <select id="dev" title="Screen size (dp)"><option value="360x640x24">Compact 360×640</option><option value="411x914x49" selected>Pixel 6 411×914</option><option value="411x960x38">4K phone 411×960 (1644×3840 px)</option></select>
  <button id="lensbtn">Lens: on</button>
  <button id="reset">Sign out / restart</button>
  <span>Mock with sample data. The real app is native (Kotlin, Jetpack Compose, Material 3).
  <a href="https://github.com/larytet/tasklane/tree/main/android">Source</a></span>
</div>
<div class="stage" id="stage"><div class="phone" id="phone"><div class="scr" id="scr"></div></div></div>
<div class="note">Sign in with any server, email and password. Try the lens (move or touch outside the highlight to slide it), "Mark all read", a comment, a board tab, or search.</div>

<script>
/* Same data as the stand-in server used to take the reference screenshots of the real app. */
const A=["Fix","Investigate","Add","Refactor","Document","Upgrade","Remove","Speed up","Cover with tests","Monitor"];
const B=["checkout retry logic","coupon endpoint rate limit","order page dark mode","payment SDK","guest cart merge","Google Pay button","invoice PDF layout","catalog search","wishlist share link","German email templates","stock count rounding","address autocomplete","webhook retry queue","cookie banner copy","gift card balance check","return label generator","sitemap generation","mobile menu overlap"];
const CATS=[["To Do","todo"],["In Progress","in_progress"],["Done","done"]], PR=["low","medium","high","medium","low","highest"], WHO=["","","Dana Levi","","Sam Cohen","Noa Bar"];
const ISS=[];
for(let n=0;n<58;n++){const c=CATS[(n*7+n%4)%3], bug=n%5===0||n%5===3;
  ISS.push({key:"SHOP-"+(58-n),summary:bug?"Bug: "+B[(n*7)%18]:A[(n*3)%10]+" "+B[(n*7+n)%18],type:bug?"Bug":"Task",status:c[0],cat:c[1],priority:PR[(n*5)%6],assignee:WHO[(n*5)%6],comments:n%6===0?n%4+1:0})}
Object.assign(ISS[57],{summary:"Checkout fails on 3DS challenge",type:"Bug",status:"In Progress",cat:"in_progress",priority:"high",assignee:"",comments:3});
Object.assign(ISS[56],{summary:"Add Apple Pay button",type:"Story",status:"In Progress",cat:"in_progress",priority:"medium",assignee:"Dana Levi",comments:0});
Object.assign(ISS[53],{summary:"Refund email has wrong total",type:"Bug",status:"Done",cat:"done",priority:"highest",assignee:"",comments:0});
const DATA={
  user:"Administrator",
  projects:[{key:"SHOP",name:"Webshop",boards:[{id:"b1",name:"Webshop board",kind:"kanban"}]},{key:"OPS",name:"Operations",mirrored:true,boards:[]},{key:"WEB",name:"Marketing site",boards:[]}],
  comments:{"SHOP-1":[
    {a:"Administrator",t:"Oct 21, 2026, 8:39 AM",b:"Thanks Dana, taking a look now."},
    {a:"Dana Levi",t:"Oct 21, 2026, 8:39 AM",b:"I can reproduce this on staging. The 3DS iframe never posts its result back."},
    {a:"Administrator",t:"Oct 21, 2026, 8:39 AM",b:"Looks like the return URL is lost after the issuer redirect. Checking the session cookie."}]},
  inbox:[
    {issue:"SHOP-1",who:"Dana Levi",summary:"Checkout fails on 3DS challenge",what:"Dana Levi commented",at:"Oct 21, 2026, 8:39 AM",unread:true},
    {issue:"SHOP-2",who:"Dana Levi",summary:"Add Apple Pay button",what:"Dana Levi assigned you",at:"Oct 20, 2026, 7:12 PM",unread:true},
    {issue:"SHOP-5",who:"Administrator",summary:"Refund email has wrong total",what:"Moved to Done",at:"Oct 19, 2026, 12:03 PM",unread:false}],
};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IC={
  menu:'M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z',
  back:'M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z',
  search:'M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
  zoom:'M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zm2.5-4h-2v2H9v-2H7V9h2V7h1v2h2v1z',
  issues:'M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z',
  projects:'M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z',
  inbox:'M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z',
  send:'M2.01 21L23 12 2.01 3 2 10l15 2-15 2z',
};
const svg=(n,c="i")=>`<svg class="${c}" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const st={lens:true,lensC:4,signedIn:false,stack:[{r:"issues"}],q:"",menu:false,boardTab:0,mfa:false,err:"",sb:48,gi:24};
const TABS={issues:"Issues",projects:"Projects",inbox:"Inbox"};
const cur=()=>st.stack[st.stack.length-1], isTab=r=>r in TABS;
const go=(r,p)=>{st.stack.push({r,...p});st.menu=false;draw()};
const tab=r=>{st.stack=[{r}];st.menu=false;draw()};
const back=()=>{if(st.stack.length>1)st.stack.pop();draw()};
function toast(m){const t=$("#toast")||Object.assign(document.createElement("div"),{id:"toast",className:"toast"});if(!t.parentNode)$("#scr").appendChild(t);t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1800)}
const chip=(t,c)=>t?`<span class="chip ${c}">${esc(t)}</span>`:"";
const meta=i=>[i.type,i.assignee,i.comments?i.comments+" comments":""].filter(Boolean).join(" · ");

function loginView(){
  return `<div class="login"><div class="t-hl">Tasklane</div>
  ${st.mfa?`<div class="t-bl" style="text-align:left;margin-bottom:8px">Enter the code from your authenticator app</div><div class="field"><div class="box"><input id="code" inputmode="numeric" maxlength="6" autofocus></div><label>Code</label></div>`
  :`<div class="field"><div class="box"><input id="srv" placeholder="tasklane.example.com" value="tasklane.example.com"></div><label>Server</label></div>
    <div class="field"><div class="box"><input id="em" value="admin@example.com"></div><label>Email</label></div>
    <div class="field"><div class="box"><input id="pw" type="password" value="demo"></div><label>Password</label></div>`}
  ${st.err?`<div class="err t-bl">${esc(st.err)}</div>`:""}
  <button class="btn" id="go">${st.mfa?"Verify":"Sign in"}</button>
  ${st.mfa?`<button class="tbtn" id="mback" style="align-self:center;margin-top:4px">Back</button>`:""}
  <div class="t-bs muted" style="margin-top:16px">Any server, email and password work. An email with "mfa" in it asks for a code (any 6 digits).</div></div>`;
}
function searchRow(){
  return `<div class="searchrow"><div class="field"><div class="box"><span class="lead">${svg("search")}</span><input id="q" placeholder="Search issues" value="${esc(st.q)}"></div></div>
  <button class="ib ${st.lens?"on":""}" id="lenstoggle" title="Lens">${svg("zoom")}</button></div>`;
}
function issuesView(){
  const q=st.q.toLowerCase(), l=ISS.filter(i=>!q||i.summary.toLowerCase().includes(q));
  if(!l.length)return searchRow()+`<div style="flex:1;display:grid;place-items:center;padding:24px" class="muted t-bl">No issues</div>`;
  if(st.lens)return searchRow()+`<div class="lens" id="lens">`+l.map((i,n)=>`<div class="lr c-${i.cat}" data-key="${i.key}" data-i="${n}"><div class="l1"><span class="key t-lm">${i.key}</span>${chip(i.status,"c-"+i.cat)}${chip(i.priority,"pc p-"+i.priority)}</div><div class="sum t-bl">${esc(i.summary)}</div><div class="meta t-bs muted">${esc(meta(i))}</div></div>`).join("")+
    `</div><div class="lcount t-lsm">${l.length} issues, touch outside the highlight to slide the lens</div>`;
  return searchRow()+`<div style="flex:1;overflow-y:auto;min-height:0;scrollbar-width:none">`+l.map(i=>`<div class="irow" data-open="${i.key}"><div class="l1"><span class="key t-lm">${i.key}</span>${chip(i.status,"c-"+i.cat)}${chip(i.priority,"p-"+i.priority)}</div><div class="sum t-bl">${esc(i.summary)}</div>${meta(i)?`<div class="t-bs muted">${esc(meta(i))}</div>`:""}</div>`).join("")+`<div class="lcount t-lsm">${l.length} issues</div></div>`;
}
function issueView(k){
  const i=ISS.find(x=>x.key===k), cs=DATA.comments[k]||[];
  return `<div class="pad"><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:8px;align-items:center"><span class="key t-ll">${k}</span>${chip(i.status,"c-"+i.cat)}${chip(i.priority,"p-"+i.priority)}</div><div class="t-tl">${esc(i.summary)}</div></div>
  <div class="sec"><div class="t-ts">Description</div><div class="t-bl">Reported by support. See the linked thread for details and steps to reproduce.</div></div>
  <div class="sec"><div class="t-ts">Details</div><div class="fields t-bm">
    <div class="kv"><span>Type</span><span>${i.type}</span></div><div class="kv"><span>Assignee</span><span>${esc(i.assignee||"Unassigned")}</span></div><div class="kv"><span>Reporter</span><span>Administrator</span></div>
    <div class="kv"><span>Labels</span><span>payments</span></div><div class="kv"><span>Estimate</span><span>5</span></div><div class="kv"><span>Created</span><span>Oct 21, 2026, 8:39 AM</span></div><div class="kv"><span>Updated</span><span>Oct 21, 2026, 8:55 AM</span></div></div></div>
  <div class="t-ts">Comments (${cs.length})</div>`+(cs.length?"":`<div class="muted t-bl">No comments yet</div>`)+
  cs.map(c=>`<div class="cmt"><div class="h"><span class="t-ll">${esc(c.a)}</span><span class="t-lsm muted">${c.t}</span></div><div class="t-bl">${esc(c.b)}</div></div>`).join("")+`</div>`;
}
function projectsView(){
  return DATA.projects.map(p=>`<div class="li" data-proj="${p.key}"><div class="grow"><div class="t-bl">${esc(p.name)}</div><div class="t-bm muted">${p.key}</div></div>${p.mirrored?chip("Jira mirror","sec"):""}</div><div class="div"></div>`).join("");
}
function projectView(k){
  const p=DATA.projects.find(x=>x.key===k);
  return (p.boards.length?`<div style="padding:16px 12px;flex:none;display:flex">${p.boards.map(b=>`<span class="assist t-ll" data-board="${b.id}">${esc(b.name)} (${b.kind})</span>`).join("")}</div>`:"")+issuesView();
}
function boardView(){
  const cols=[["To Do","todo"],["In Progress","in_progress"],["Done","done"]], col=cols[st.boardTab];
  const all=ISS.slice(0,12), cnt=c=>all.filter(i=>i.cat===c).length;
  return `<div class="tabs">${cols.map((c,n)=>`<button class="${n===st.boardTab?"on":""}" data-bt="${n}">${c[0]} ${cnt(c[1])}</button>`).join("")}</div><div class="cards">`+
  all.filter(i=>i.cat===col[1]).map(i=>`<div class="card" data-open="${i.key}"><div class="l1"><span class="key t-lm">${i.key}</span>${chip(i.priority,"p-"+i.priority)}</div><div class="t-bl">${esc(i.summary)}</div>${i.assignee?`<div class="t-bs muted">${esc(i.assignee)}</div>`:""}</div>`).join("")+`</div>`;
}
function inboxView(){
  const any=DATA.inbox.some(n=>n.unread);
  return (any?`<div style="display:flex;justify-content:flex-end;padding:0 8px"><button class="tbtn" id="markall">Mark all read</button></div>`:"")+
  DATA.inbox.map(n=>`<div class="li three" data-open="${n.issue}"><div class="grow"><div class="t-lsm muted">${n.issue} · ${esc(n.who)}</div><div class="t-bl" style="${n.unread?"font-weight:700":""};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n.summary)}</div><div class="t-bm muted">${esc(n.what)}</div><div class="t-lsm muted">${n.at}</div></div>${n.unread?'<i class="badge"></i>':""}</div><div class="div"></div>`).join("");
}

function draw(){
  const scr=$("#scr"), c=cur();
  scr.style.setProperty("--gi",st.gi+"px"); scr.style.setProperty("--sbh",st.sb+"px");
  const status=`<div class="sb" style="height:${st.sb}px;align-items:flex-end;padding-bottom:${Math.max(4,st.sb/2-9)}px"><span id="clock">${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}).replace(/\s?[AP]M/i,"")}</span><span><svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg><svg viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg><svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></span></div>`;
  if(!st.signedIn){scr.innerHTML=status+loginView()+`<div class="gi"></div>`;wireLogin();return}
  const title=isTab(c.r)?TABS[c.r]:c.r==="issue"||c.r==="project"?c.key:"Board";
  const body=c.r==="issues"?issuesView():c.r==="projects"?projectsView():c.r==="inbox"?inboxView():c.r==="issue"?issueView(c.key):c.r==="project"?projectView(c.key):boardView();
  const fixed=(c.r==="issues"&&st.lens)||c.r==="project";
  const nav=isTab(c.r)?`<div class="nav">${Object.keys(TABS).map(t=>`<button class="item ${t===c.r?"on":""}" data-tab="${t}"><span class="pill">${svg(t)}</span><span class="t-lm">${TABS[t]}</span></button>`).join("")}</div>`:"";
  const compose=c.r==="issue"?`<div class="cbar"><div class="field"><div class="box"><input id="cm" placeholder="Add a comment"></div></div><button class="ib" id="send">${svg("send")}</button></div>`:"";
  scr.innerHTML=status+`<div class="tb ${isTab(c.r)?"":"back"}">${isTab(c.r)?"":`<button class="ib" id="back">${svg("back")}</button>`}<span class="title t-tl">${esc(title)}</span><button class="ib" id="more">${svg("menu")}</button></div>
  <div class="content${fixed?" fixed":""}" id="scroll">${body}</div>${compose}${nav||`<div class="gi"></div>`}
  ${st.menu?`<div class="menu t-bl"><div class="dis">Signed in as ${DATA.user}</div><div class="act" id="out">Sign out</div></div>`:""}`;
  wire();
}
function wireLogin(){
  const submit=()=>{
    if(st.mfa){if(!/^\d{6}$/.test(($("#code").value||"").trim())){st.err="That code is not valid";draw();return}st.mfa=false;st.err="";st.signedIn=true;draw();return}
    if(!$("#em").value||!$("#pw").value){st.err="Enter your email and password";draw();return}
    if($("#em").value.includes("mfa")){st.mfa=true;st.err="";draw();return}
    st.err="";st.signedIn=true;draw();
  };
  $("#go").onclick=submit; document.querySelectorAll(".login input").forEach(i=>i.onkeydown=e=>{if(e.key==="Enter")submit()});
  const b=$("#mback"); if(b)b.onclick=()=>{st.mfa=false;st.err="";draw()};
}
function wire(){
  document.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>go("issue",{key:e.dataset.open}));
  document.querySelectorAll("[data-proj]").forEach(e=>e.onclick=()=>go("project",{key:e.dataset.proj}));
  document.querySelectorAll("[data-board]").forEach(e=>e.onclick=()=>{st.boardTab=0;go("board",{id:e.dataset.board})});
  document.querySelectorAll("[data-tab]").forEach(e=>e.onclick=()=>tab(e.dataset.tab));
  document.querySelectorAll("[data-bt]").forEach(e=>e.onclick=()=>{st.boardTab=+e.dataset.bt;draw()});
  const b=$("#back"); if(b)b.onclick=back;
  const L=$("#lens"); if(L)initLens(L);
  $("#more").onclick=()=>{st.menu=!st.menu;draw()};
  const o=$("#out"); if(o)o.onclick=reset;
  const lt=$("#lenstoggle"); if(lt)lt.onclick=()=>setLens(!st.lens);
  const q=$("#q"); if(q){q.oninput=()=>{st.q=q.value;const p=q.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
  const m=$("#markall"); if(m)m.onclick=()=>{DATA.inbox.forEach(n=>n.unread=false);toast("All notifications marked read");draw()};
  const cm=$("#cm"); if(cm){
    const send=()=>{const v=cm.value.trim();if(!v)return;const k=cur().key;(DATA.comments[k]=DATA.comments[k]||[]).push({a:DATA.user,t:"Just now",b:v});draw();const s=$("#scroll");s.scrollTop=s.scrollHeight};
    $("#send").onclick=send; cm.onkeydown=e=>{if(e.key==="Enter")send()};
    cm.oninput=()=>$("#send").classList.toggle("go",!!cm.value.trim());
  }
}

/* The lens: the same layout rule as android/.../ui/Lens.kt */
const LENS={ROW_MAX:88,ROW_CAP:96,SHARE:2/3,MIN:.1,FALL:3};
function lensLayout(n,H,c){
  const {ROW_MAX,ROW_CAP,SHARE,MIN,FALL}=LENS;
  if(n<=0||H<=0)return {h:[],tops:[],start:0,k:0};
  const fin=(h,start,k)=>{let y=0;const tops=h.map(v=>{const t=y;y+=v;return t});return {h,tops,start,k}};
  if(n*ROW_MAX<=H)return fin(Array(n).fill(ROW_MAX),0,n);
  const k=Math.min(n,Math.max(1,Math.round(SHARE*H/ROW_MAX)));
  const start=Math.min(n-k,Math.max(0,Math.round(c-(k-1)/2)));
  const hw=Math.min(SHARE*H/k,ROW_CAP);
  const w=Array.from({length:n},(_,i)=>{if(i>=start&&i<start+k)return 0;const d=i<start?start-i:i-(start+k-1),x=(d-1)/FALL;return MIN+(1-MIN)*Math.exp(-(x*x))});
  const sum=w.reduce((a,b)=>a+b,0), out=H-k*hw;
  return fin(w.map((v,i)=>i>=start&&i<start+k?hw:(sum>0?out*v/sum:0)),start,k);
}
const rowAt=(lay,y)=>{if(!lay.h.length)return -1;for(let i=0;i<lay.h.length;i++)if(y<lay.tops[i]+lay.h[i])return i;return lay.h.length-1};
function layoutLens(L){
  const rows=[...L.children], H=L.clientHeight; if(!rows.length||!H)return;
  const lay=lensLayout(rows.length,H,st.lensC); L._lay=lay;
  rows.forEach((r,i)=>{
    const h=lay.h[i], inw=i>=lay.start&&i<lay.start+lay.k;
    r.style.height=h+"px";
    r.className="lr "+(r.dataset.c||r.className.split(" ").find(x=>x.startsWith("c-"))||"")+" "+(h>=50?"lv3":h>=24?"lv2":h>=10?"lv1":"lv0")+(inw?" inlens":"");
    r.querySelector(".sum").classList.toggle("two",h>=76);
    r.querySelector(".meta").style.display=h>=64||h<50?"":"none";
    r.style.fontSize=h<24&&h>=10?Math.max(8,Math.min(13,h-3))+"px":"";
    const s=r.querySelector(".sum"); if(h<24&&h>=10)s.style.fontSize=Math.max(8,Math.min(13,h-3))+"px"; else s.style.fontSize="";
  });
}
function initLens(L){
  L.querySelectorAll(".lr").forEach(r=>{r.dataset.c=[...r.classList].find(x=>x.startsWith("c-"))});
  layoutLens(L);
  const yOf=e=>{const r=L.getBoundingClientRect();return (e.clientY-r.top)*(L.offsetHeight/r.height)};
  const inWin=i=>i>=L._lay.start&&i<L._lay.start+L._lay.k;
  // touching, dragging or hovering outside the window slides it there; inside it nothing moves, so a row can be clicked
  const slide=e=>{const i=rowAt(L._lay,yOf(e)); if(i>=0&&!inWin(i)){st.lensC=i;layoutLens(L);return true}return false};
  let slid=false;
  L.onpointermove=e=>{if(slide(e)&&e.buttons)slid=true};
  L.onpointerdown=e=>{slid=slide(e)};
  L.onclick=e=>{if(slid){slid=false;return} const i=rowAt(L._lay,yOf(e)); if(i>=0&&inWin(i))go("issue",{key:L.children[i].dataset.key})};
  L.onwheel=e=>{e.preventDefault();st.lensC=Math.max(0,Math.min(L.children.length-1,st.lensC+Math.sign(e.deltaY)));layoutLens(L)};
}
function setLens(on){st.lens=on;$("#lensbtn").textContent="Lens: "+(on?"on":"off");draw()}
function reset(){st.signedIn=false;st.stack=[{r:"issues"}];st.q="";st.menu=false;st.mfa=false;st.err="";draw()}
$("#reset").onclick=reset; $("#lensbtn").onclick=()=>setLens(!st.lens);
$("#theme").onclick=()=>{const d=document.body.classList.toggle("dark");$("#theme").textContent=d?"Light mode":"Dark mode";try{localStorage.setItem("tl-mock-dark",d?"1":"0")}catch(e){}};
try{const s=localStorage.getItem("tl-mock-dark"); if(s==="1"||(s===null&&matchMedia("(prefers-color-scheme: dark)").matches)){document.body.classList.add("dark");$("#theme").textContent="Light mode"}}catch(e){}
/* ?theme=light|dark and ?dev=WxHxSB for screenshots and links */
{const p=new URLSearchParams(location.search);
 if(p.get("theme")){const d=p.get("theme")==="dark";document.body.classList.toggle("dark",d);$("#theme").textContent=d?"Light mode":"Dark mode"}
 if(p.get("dev"))$("#dev").value=p.get("dev");
 if(p.get("lens")==="0"){st.lens=false;$("#lensbtn").textContent="Lens: off"}
 if(p.has("in"))st.signedIn=true
 if(p.has("bare"))document.body.classList.add("bare")
 if(p.get("screen")){const [r,a]=p.get("screen").split(":"); st.stack=isTab(r)?[{r}]:[{r:"issues"},{r,key:a,id:a}]}
 if(p.get("q"))st.q=p.get("q"); if(p.has("menu"))st.menu=true}
function fit(){
  const [w,h,sb]=$("#dev").value.split("x").map(Number); st.sb=sb; st.gi=24;
  const ph=$("#phone"), stg=$("#stage"), W=w+20, H=h+20;
  const avail=innerHeight-$(".bar").offsetHeight-$(".note").offsetHeight-48;
  const p=new URLSearchParams(location.search), fixed=p.get("scale");
  const sc=fixed?+fixed:Math.min(1.25,Math.max(.3,Math.min(avail/H,(innerWidth-32)/W)));
  ph.style.width=W+"px"; ph.style.height=H+"px"; ph.style.transform="scale("+sc+")";
  stg.style.width=W*sc+"px"; stg.style.height=H*sc+"px";
  draw();
}
$("#dev").onchange=fit; addEventListener("resize",fit);
fit();
</script>
