name: Pages

# Publishes the static mocks under mock/ (mock/android/ -> /android/) and the web UI mock (/web/), which is the real app from
# internal/web/static run against a pretend server in the browser (mock/web/build.mjs), so it follows every change to the UI.
on:
  push:
    branches: [main]
    paths: ['mock/**', 'internal/web/static/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r mock/. _site/
          node mock/web/build.mjs _site/web
          rm _site/web/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
